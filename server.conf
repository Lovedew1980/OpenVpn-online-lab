port 1194
proto udp
dev tun

ca /workspaces/OpenVpn-online-lab/certs/ca.crt
cert /workspaces/OpenVpn-online-lab/certs/server.crt
key /workspaces/OpenVpn-online-lab/certs/server.key
dh /workspaces/OpenVpn-online-lab/certs/dh.pem
tls-auth /workspaces/OpenVpn-online-lab/certs/ta.key 0

server 10.8.0.0 255.255.255.0
topology subnet
keepalive 10 120

data-ciphers AES-256-GCM:AES-128-GCM
auth SHA256

persist-key
persist-tun
user nobody
group nogroup

status openvpn-status.log
verb 3